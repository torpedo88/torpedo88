<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170" role="img" aria-label="Career path: QA (Quality engineering) → Release Eng (Developer, build and release) → DevOps (CI/CD and platform) → Architecture (Systems and SDLC design) → Leadership (Teams, mentoring, founder)">
<defs><linearGradient id="line" x1="120" x2="1080" gradientUnits="userSpaceOnUse">
<stop offset="0.00" stop-color="#22D3EE"/><stop offset="0.25" stop-color="#34D399"/><stop offset="0.50" stop-color="#A855F7"/><stop offset="0.75" stop-color="#E879F9"/><stop offset="1.00" stop-color="#FBBF24"/>
</linearGradient></defs>
<style>
  .flow{animation:flow 1.6s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-24}}
  .ring{transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out infinite}
  @keyframes ring{0%{transform:scale(1);opacity:.9}100%{transform:scale(2.2);opacity:0}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<line x1="120" y1="52" x2="1080" y2="52" stroke="url(#line)" stroke-opacity=".25" stroke-width="4"/>
<line class="flow" x1="120" y1="52" x2="1080" y2="52" stroke="url(#line)" stroke-width="2" stroke-dasharray="12 12"/>
<circle class="ring" style="animation-delay:0.0s" cx="120" cy="52" r="14" fill="none" stroke="#22D3EE"/>
<circle cx="120" cy="52" r="9" fill="#22D3EE"/>
<text x="120" y="108" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#F8FAFC">QA</text>
<text x="120" y="136" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#94A3B8">Quality engineering</text><circle class="ring" style="animation-delay:0.5s" cx="360" cy="52" r="14" fill="none" stroke="#34D399"/>
<circle cx="360" cy="52" r="9" fill="#34D399"/>
<text x="360" y="108" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#F8FAFC">Release Eng</text>
<text x="360" y="136" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#94A3B8">Developer, build and release</text><circle class="ring" style="animation-delay:1.0s" cx="600" cy="52" r="14" fill="none" stroke="#A855F7"/>
<circle cx="600" cy="52" r="9" fill="#A855F7"/>
<text x="600" y="108" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#F8FAFC">DevOps</text>
<text x="600" y="136" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#94A3B8">CI/CD and platform</text><circle class="ring" style="animation-delay:1.5s" cx="840" cy="52" r="14" fill="none" stroke="#E879F9"/>
<circle cx="840" cy="52" r="9" fill="#E879F9"/>
<text x="840" y="108" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#F8FAFC">Architecture</text>
<text x="840" y="136" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#94A3B8">Systems and SDLC design</text><circle class="ring" style="animation-delay:2.0s" cx="1080" cy="52" r="14" fill="none" stroke="#FBBF24"/>
<circle cx="1080" cy="52" r="9" fill="#FBBF24"/>
<text x="1080" y="108" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#F8FAFC">Leadership</text>
<text x="1080" y="136" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#94A3B8">Teams, mentoring, founder</text>
</svg>