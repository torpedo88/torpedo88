<svg xmlns="http://www.w3.org/2000/svg" width="600" height="230" viewBox="0 0 600 230" role="img" aria-label="Restaurant ordering platform: Branded storefront, online ordering, Stripe payments, Uber Direct delivery and kitchen printing for independent restaurants.">
<defs>
  <radialGradient id="glow" cx="1" cy="0" r="1"><stop offset="0" stop-color="#A855F7" stop-opacity=".45"/><stop offset=".6" stop-color="#A855F7" stop-opacity="0"/></radialGradient>
