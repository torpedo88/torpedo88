<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-label="Standards over heroics: Every rule has an owner, a CI gate that fails the build, and a process to change it. Built to hand off: Rules bind every contributor, human or AI, so the codebase holds without me in every review. Grow the people: I mentor four engineers and review their PRs for security and correctness, alongside an AI review. Kill bad plans early: Agents attack plans before code exists. One review threw out a plan over 19 defects. Spend like an owner: Serverless over custom infra, concierge before self-serve. Cut scope, never security. Assume an AI-armed attacker: Row-level security on every tenant table, no secrets in the browser, no trusted client.">
